<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="ttl desc">
<title id="ttl">Anisotropic vertical contact geometries and current paths</title>
<desc id="desc">Original schematic of planar and circular bilayer contacts with finite specific interface resistance and anisotropic current spreading. Curves are qualitative only.</desc>
<defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#dae6f4"/><stop offset="1" stop-color="#9ebbd5"/></linearGradient><linearGradient id="film" x2="0" y2="1"><stop stop-color="#e9f7ff"/><stop offset="1" stop-color="#b6e0ec"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#d06740" stroke-width="1.7"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.head{font-size:23px;font-weight:bold}.lab{font-size:18px}.sub{font-size:15px;fill:#4e657c}.layer{stroke:#41617c;stroke-width:2}.current{fill:none;stroke:#d06740;stroke-width:3.5;marker-end:url(#arr)}.measure{fill:none;stroke:#234d72;stroke-width:2;stroke-dasharray:7 5}</style></defs>
