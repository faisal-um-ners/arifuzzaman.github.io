<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#111}.title{font-size:32px;font-weight:700}.pt{font-size:25px;font-weight:700}.lbl{font-size:21px}.small{font-size:18px}.blue{fill:#174b9b}.red{fill:#a91414}.green{fill:#1c651c}.violet{fill:#6a318c}.orange{fill:#b66b00}</style><rect width="1400" height="560" fill="white"/><text x="700" y="42" text-anchor="middle" class="title">Single-layer and two-layer Smith–Purcell configurations</text><g transform="translate(40,75)"><text x="310" y="30" text-anchor="middle" class="pt">(a) Single-layer grating</text><rect x="20" y="60" width="600" height="250" fill="#e7f0fc"/><rect x="20" y="205" width="600" height="105" fill="#fce7e7"/><line x1="20" y1="310" x2="620" y2="310" stroke="#c22" stroke-width="2" stroke-dasharray="8 6"/><line x1="20" y1="205" x2="620" y2="205" stroke="#2450c4" stroke-width="2" stroke-dasharray="8 6"/><rect x="20" y="390" width="600" height="34" fill="#707070"/><rect x="20" y="310" width="600" height="80" fill="#e5f3e5"/><g fill="#707070" stroke="#2b2b2b" stroke-width="1.5"><rect x="55" y="310" width="38" height="80"/><rect x="175" y="310" width="38" height="80"/><rect x="295" y="310" width="38" height="80"/><rect x="415" y="310" width="38" height="80"/><rect x="535" y="310" width="38" height="80"/></g><g fill="#e6a21a"><rect x="55" y="306" width="38" height="4"/><rect x="175" y="306" width="38" height="4"/><rect x="295" y="306" width="38" height="4"/><rect x="415" y="306" width="38" height="4"/><rect x="535" y="306" width="38" height="4"/></g><text x="80" y="120" class="blue lbl" font-weight="700">Vacuum / radiation region</text><text x="80" y="260" class="red lbl" font-weight="700">Beam–grating gap</text><text x="80" y="355" class="green lbl" font-weight="700">Lower grating</text><line x1="190" y1="198" x2="430" y2="198" stroke="#174b9b" stroke-width="6"/><polygon points="430,198 410,187 410,209" fill="#1