<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><style>text{font-family:Georgia,"Times New Roman",serif;fill:#111}.t{font-size:29px;font-weight:700}.a{font-size:20px}.v{font-size:22px;font-weight:700}.note{font-size:16px}</style><rect width="900" height="520" fill="white"/><text x="450" y="42" text-anchor="middle" class="t">Example from the published PIC comparison</text><line x1="95" y1="430" x2="850" y2="430" stroke="#111" stroke-width="2"/><line x1="95" y1="90" x2="95" y2="430" stroke="#111" stroke-width="2"/><g stroke="#ccc"><line x1="95" y1="350" x2="850" y2="350"/><line x1="95" y1="270" x2="850" y2="270"/><line x1="95" y1="190" x2="850" y2="190"/><line x1="95" y1="110" x2="850" y2="110"/></g><g class="a"><text x="65" y="435" text-anchor="end">0</text><text x="65" y="355" text-anchor="end">1</text><text x="65" y="275" text-anchor="end">2</text><text x="65" y="195" text-anchor="end">3</text><text x="65" y="115" text-anchor="end">4</text></g><text x="28" y="280" transform="rotate(-90 28 280)" class="a">Normalized radiation intensity</text><rect x="155" y="350" width="150" height="80" fill="#4c78a8"/><rect x="375" y="110" width="150" height="320" fill="#f58518"/><rect x="595" y="350" width="150" height="80" fill="#54a24b"/><g class="v" text-anchor="middle"><text x="230" y="338">≈ 1×</text><text x="450" y="98">≈ 4×</text><text x="670" y="338">≈ 1×</text></g><g class="a" text-anchor="middle"><text x="230" y="462">Single layer</text><text x="230" y="487">2000 A/m</text><text x="450" y="462">Two layer</text><text x="450" y="487">2000 A/m</text><text x="670" y="462">Two layer</text><text x="670" y="487">500 A/m</text></g><text x="450" y="515" text-anchor="middle" class="note">w = 60 μm, h₁ = h₂ = 40 μm; normalized to the single-layer 2000 A/m case.</text></svg>