<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Anisotropic coordinate stretching scaling</title><desc id="desc">Logarithmic analytic curve of one over square root alpha, showing lateral-coordinate scaling relative to film thickness.</desc><rect width="1120" height="640" fill="#f8fbfe" rx="22"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1b334b}.heading{font-size:29px;font-weight:bold}.axes{stroke:#203a54;stroke-width:2.2}.tick{font-size:18px}.small{font-size:16px;fill:#526b83}.grid{stroke:#d4e2eb;stroke-width:1.5;stroke-dasharray:5 7}</style><text x="60" y="62" class="heading">Anisotropic Laplace equation: lateral length scaling</text><text x="60" y="95" class="small">Coordinate-stretching identity: ℓ / h ∼ 1 / √α, where α = ρparallel / ρvertical</text><path d="M144 140V520H1000" class="axes"/><g class="grid"><path d="M144 520H1000M144 427H1000M144 334H1000M144 241H1000M144 148H1000M144 148V520M355 148V520M566 148V520M777 148V520M988 148V520"/></g><path d="M144 520 L988 148" stroke="#1976a5" stroke-width="5" fill="none"/><g class="tick" text-anchor="end"><text x="126" y="526">1</text><text x="126" y="433">3.16</text><text x="126" y="340">10</text><text x="126" y="247">31.6</text><text x="126" y="154">100</text></g><g class="tick" text-anchor="middle"><text x="144" y="551">1</text><text x="355" y="551">10⁻¹</text><text x="566" y="551">10⁻²</text><text x="777" y="551">10⁻³</text><text x="988" y="551">10⁻⁴</text></g><text x="570" y="593" font-size="20" text-anchor="middle" fill="#203a54">Anisotropy ratio α (logarithmic, decreasing →)</text><text x="48" y="355" font-size="20" text-anchor="middle" fill="#203a54" transform="rotate(-90 48 355)">Relative lateral scale ℓ / h (logarithmic)</text><circle cx="566" cy="334" r="7" fill="#d0663e" stroke="white" stroke-width="3"/><circle cx="988" cy="148" r="7" fill="#d0663e" stroke="white" stroke-width="3"/><text x="584" y="324" class="small">α = 0.01 → 10h</text><text x="754" y="134" class="small">α = 0.0001 → 100h</text><text x="978" y="620" text-anchor="end" class="small">Analytical scaling, not measured current-density data</text></svg>