<article class="hub-card reveal">
  <a class="hub-card-link" href="{{ include.article.url | relative_url }}">
    <div class="hub-card-media">
      {% if include.article.image %}
      <img src="{{ include.article.image | relative_url }}" alt="" loading="lazy">
      {% else %}
      <div class="hub-card-placeholder" aria-hidden="true"></div>
      {% endif %}
    </div>
    <div class="hub-card-body">
      <div class="hub-card-meta">
        <span>{{ include.article.category }}</span>
        <time datetime="{{ include.article.date | date_to_xmlschema }}">{{ include.article.date | date: "%b %-d, %Y" }}</time>
      </div>
      <h3>{{ include.article.title }}</h3>
      <p>{{ include.article.summary }}</p>
      <span class="hub-card-read">Read article <span aria-hidden="true">→</span></span>
    </div>
  </a>
</article>
